<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1628" />
    <meta name="description" content="The Living Blueprint: Glass Greenhouse Estate — physics match-3 puzzle game" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>The Living Blueprint</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #050008; }
      #root { width: 100%; height: 100%; }
      #pre-js-loader {
        position: fixed; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #050008; gap: 18px; z-index: 0;
      }
      #pre-js-loader .title {
        font-family: Georgia, serif; font-size: 28px; font-weight: 900; letter-spacing: 5px;
      }
      #pre-js-loader .m { color: #ff00cc; text-shadow: 0 0 28px rgba(255,0,204,0.8); }
      #pre-js-loader .amp { color: rgba(255,255,255,0.25); margin: 0 10px; }
      #pre-js-loader .c { color: #00ffff; text-shadow: 0 0 28px rgba(0,255,255,0.8); }
      #pre-js-loader .init {
        font-family: monospace; font-size: 11px; letter-spacing: 3px;
        background: linear-gradient(to left, #00ffff 50%, #ff00cc 50%);
        background-size: 200% 100%;
        background-position: 100% 0;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: loadBar 3s linear infinite;
      }
      #pre-js-loader .init::after {
        content: '.';
        animation: dotCycle 1.8s steps(1) infinite;
      }
      @keyframes loadBar {
        0%   { background-position: 100% 0; }
        100% { background-position: 0% 0; }
      }
      @keyframes dotCycle {
        0%  { content: '.'; }
        17% { content: '..'; }
        33% { content: '...'; }
        50% { content: '.'; }
        67% { content: '..'; }
        83% { content: '...'; }
      }
    </style>
  </head>
  <body>
    <div id="pre-js-loader">
      <div class="title">
        <span class="m">MAGENTA DIE</span><span class="amp">&amp;</span><span class="c">CYAN CODE</span>
      </div>
      <div class="init">INITIALIZING</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
