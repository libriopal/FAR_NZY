<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1628" />
    <meta name="description" content="The Living Blueprint: Glass Greenhouse Estate — physics match-3 puzzle game" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>The Living Blueprint</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #050008; }
      #root { width: 100%; height: 100%; }
      @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.8; transform: scale(1.05); } }
      #pre-js-loader {
        position: fixed; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #050008; gap: 14px; z-index: 0;
      }
      #pre-js-loader .title {
        font-family: Georgia, serif; font-size: 20px; font-weight: 900;
        color: #f0c860; letter-spacing: 4px;
        text-shadow: 0 0 20px rgba(201,168,76,0.55);
      }
      #pre-js-loader .sub {
        font-family: monospace; font-size: 10px; letter-spacing: 3px;
        color: rgba(232,213,163,0.45);
      }
      #pre-js-loader .dot {
        width: 6px; height: 6px; background: #c9a84c;
        transform: rotate(45deg);
        box-shadow: 0 0 8px rgba(201,168,76,0.7);
        animation: pulse 1.4s ease-in-out infinite;
      }
    </style>
  </head>
  <body>
    <div id="pre-js-loader">
      <div class="dot"></div>
      <div class="title">FARKLE FRENZY</div>
      <div class="sub">INITIALIZING…</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
